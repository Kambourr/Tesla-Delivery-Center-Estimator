name: CI

# Install, lint, typecheck, and test. No secrets, no packaging, no network
# calls from the test suite. Primary runner is macos-latest; ubuntu-latest
# runs the same jobs.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff check src tests scripts packaging
          python -m ruff format --check src tests scripts packaging

      - name: Typecheck
        run: python -m mypy

      - name: Run tests
        run: python -m pytest

      - name: CLI help
        run: python -m dce --help
