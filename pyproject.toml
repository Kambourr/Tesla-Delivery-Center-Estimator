[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-center-estimator"
version = "0.0.0"
description = "Public-data desktop estimator for a hypothetical Tesla delivery center at a US ZIP code."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jacob Kambour" }]
dependencies = [
    # pandas 2.3.x (not 3.x) so later golden-number tests stay on the 2.x API.
    # numpy is pinned because geopandas 1.2 requires numpy>=2.
    "numpy==2.2.6",
    "pandas==2.3.3",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "pyogrio==0.13.0",
    "geopandas==1.2.0",
    "folium==0.20.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]
# PyInstaller is a later packaging extra. M0 CI does not install it.
packaging = [
    "pyinstaller==6.22.3",
]

[project.scripts]
dce = "dce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dce = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
