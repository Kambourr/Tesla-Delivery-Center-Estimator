[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-center-estimator"
version = "0.0.0"
description = "Public-data desktop estimator for a hypothetical Tesla delivery center at a US ZIP code."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jacob Kambour" }]
dependencies = [
    # pandas 2.3.x (not 3.x) so later golden-number tests stay on the 2.x API.
    # numpy is pinned because geopandas 1.2 requires numpy>=2.
    "numpy==2.2.6",
    "pandas==2.3.3",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "pyogrio==0.13.0",
    "geopandas==1.2.0",
    "folium==0.20.0",
    "PyYAML==6.0.3",
    # OS webview (WKWebView on macOS). Imported only when the window opens.
    "pywebview==6.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "coverage==7.17.2",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
]
# PyInstaller is a later packaging extra. M0 CI does not install it.
packaging = [
    "pyinstaller==6.22.3",
]

[project.scripts]
dce = "dce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dce = [
    "storage/*.sql",
    "app/web/*.html",
    "app/web/*.css",
    "app/web/*.js",
    "app/web/vendor/*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dce"]

[tool.ruff.lint.per-file-ignores]
# PyInstaller injects Analysis, PYZ, EXE, COLLECT, BUNDLE, and SPECPATH.
"packaging/*.spec" = ["F821"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["dce"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "geopandas",
    "geopandas.*",
    "folium",
    "folium.*",
    "pandas",
    "pandas.*",
    "pyogrio",
    "pyogrio.*",
    "shapely",
    "shapely.*",
    "pyproj",
    "pyproj.*",
    "yaml",
    "webview",
    "webview.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=dce --cov-report=term-missing"

[tool.coverage.run]
source = ["dce"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
