<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Delivery Center Estimator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23f3f4f6' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%238eb6ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="map"></div>
    <header id="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <strong>Delivery Center</strong>
          <em>Estimator</em>
        </div>
      </div>
      <form id="search-form" role="search">
        <label class="sr" for="search">Search ZIP</label>
        <input
          id="search"
          name="zip"
          inputmode="numeric"
          maxlength="5"
          placeholder="Search ZIP"
          autocomplete="off"
          spellcheck="false"
        />
        <ul id="search-results" hidden></ul>
      </form>
      <button id="compare-toggle" type="button" aria-pressed="false">Compare</button>
    </header>
    <p id="basemap-note" hidden>Basemap tiles are offline. ZIP boundaries and centers are on this machine.</p>
    <aside id="panel" data-state="empty" aria-live="polite">
      <div id="panel-body">
        <p class="eyebrow">Public data only</p>
        <h1>Where should the next center go?</h1>
        <p class="lede">
          Pick a ZIP. Cost per delivery, the catchment, and a 10-year cash flow
          show up here.
        </p>
      </div>
    </aside>
    <div id="hover-tip" hidden></div>
    <script src="vendor/maplibre-gl.js"></script>
    <script src="app.js"></script>
  </body>
</html>
